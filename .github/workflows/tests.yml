name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional jasmine spec/glob filter'
        required: false
        default: ''

jobs:
  Test:
    strategy:
      matrix:
        node_version: ['14', '16']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Pin npm registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-05-27T16:17:12.429000Z
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        if: ${{ github.event.inputs.test-filter == '' }}
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        if: ${{ github.event.inputs.test-filter == '' }}
        run: npm run test:specs
      - name: Run Filtered Tests 👩🏽‍💻
        if: ${{ github.event.inputs.test-filter != '' }}
        run: npm test -- ${{ github.event.inputs.test-filter }}
      - name: Pack tarball 🗜️
        if: ${{ matrix.node_version == '14' }}
        run: |
          npm i -g npm@7.12.0
          npm pack
      - name: Upload tarball
        if: ${{ matrix.node_version == '14' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error
